<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vokabelkasten</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#EDEFEA">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Nunito:wght@400;600;800&family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EDEFEA; --surface:#FFFFFF; --card:#FFFDF7; --ink:#1C2320; --muted:#646E69;
  --line:#D8DCD5; --accent:#244A7C; --accent-ink:#FFFFFF; --accent-soft:#DCE5F1;
  --red:#C8433A; --rule:rgba(46,104,170,.20); --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.08);
  --display:"Bricolage Grotesque",-apple-system,"Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111513; --surface:#1A201D; --card:#1E2522; --ink:#E7ECE9; --muted:#96A09B;
    --line:#2B3430; --accent:#8EB1E3; --accent-ink:#0E1A2B; --accent-soft:#1F2C3E;
    --red:#E0675D; --rule:rgba(142,177,227,.13); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --surface:#1A201D; --card:#1E2522; --ink:#E7ECE9; --muted:#96A09B;
  --line:#2B3430; --accent:#8EB1E3; --accent-ink:#0E1A2B; --accent-soft:#1F2C3E;
  --red:#E0675D; --rule:rgba(142,177,227,.13); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))!important;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.bar h1{margin:0;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.hbtn{color:var(--accent);font-size:16px;padding:6px 2px;justify-self:start;white-space:nowrap}
.hright{justify-self:end}
.hright .hbtn{justify-self:end}

main{max-width:620px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.big{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1.05;margin:8px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.label{margin:6px 0 -8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.group{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.group li+li{border-top:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.frow:active{background:var(--accent-soft)}
.frow:disabled{opacity:.45}
.tab{flex:none;width:10px;height:38px;border-radius:3px;background:var(--c)}
.frow .t{flex:1;min-width:0}
.frow strong{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow small{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:22px;line-height:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface);font-weight:600;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.ghost{box-shadow:none;background:transparent;color:var(--accent)}
.danger{color:var(--red);font-weight:600;padding:12px;align-self:center}
.danger.armed{background:var(--red);color:#fff;border-radius:10px}

.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px;border:1.5px dashed var(--line);margin:0}

.fhead{display:flex;align-items:center;gap:14px;margin-top:6px}
.fhead .tab{height:52px;width:12px}
.fhead .big{margin:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;min-height:118px}
.mode strong{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.mode span{font-size:14px;color:var(--muted);line-height:1.3}
.mode.learn{background:var(--accent);color:var(--accent-ink)}
.mode.learn span{color:inherit;opacity:.8}
.mode .ic{font-size:22px;line-height:1;margin-bottom:auto}

.plist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.plist li{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;font-family:var(--serif);font-size:16px}
.plist li+li{border-top:1px solid var(--line)}
.plist .b{color:var(--muted)}
.plist .x{color:var(--muted);font-style:italic;font-family:var(--body);font-size:14px}
.plist li span{overflow-wrap:anywhere}

.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{font-family:var(--serif);resize:none;overflow:hidden;min-height:46px;line-height:1.4}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}

#elist{display:flex;flex-direction:column;gap:14px}
.ecard{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ecard::before{content:"";position:absolute;left:0;right:0;top:44px;height:2px;background:var(--red);opacity:.5}
.etop{display:flex;justify-content:space-between;align-items:center;height:24px;margin-bottom:10px}
.num{font-family:var(--display);font-weight:700;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.del{font-size:14px;color:var(--muted);padding:4px 8px;border-radius:8px}
.del.armed{background:var(--red);color:#fff}
.ecard textarea{background:transparent}
.addbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}

/* Lernmodus */
.learn{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.count{margin:0;text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.stage{perspective:1400px;touch-action:pan-y}
.flash{position:relative;height:clamp(280px,54dvh,500px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none}
.flash.flipped{transform:rotateY(180deg)}
.flash.no-anim{transition:none}
.flash.in{animation:slidein .28s ease-out}
.flash.in.back-in{animation-name:slideback}
@keyframes slidein{from{opacity:0;translate:28px 0}to{opacity:1;translate:0 0}}
@keyframes slideback{from{opacity:0;translate:-28px 0}to{opacity:1;translate:0 0}}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding:16px 22px 18px;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:52px;height:2px;background:var(--red);opacity:.55}
.face.back{transform:rotateY(180deg);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);background-position:0 54px;background-repeat:no-repeat;background-size:100% calc(100% - 54px)}
.side{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);height:28px;display:flex;align-items:center}
.word{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;padding-top:20px;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;width:100%}
.word.m{font-size:25px}
.word.l{font-size:19px;font-weight:400}
.word.none{color:var(--muted);font-weight:400;font-size:17px;font-style:italic}
.hint{font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.controls .btn{padding:0 10px}
.done{display:flex;flex-direction:column;gap:12px;text-align:center;padding-top:20px}
.done .big{margin-bottom:4px}

.loading{padding:60px 0;text-align:center;color:var(--muted)}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,15,12,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.sheet h2{margin:0;font-family:var(--display);font-size:22px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.gear{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:-8px;border-radius:50%;color:var(--muted)}
.gear:active{background:var(--accent-soft)}
.gear svg{width:22px;height:22px}
.opts{display:grid;gap:10px}
.opts.fonts{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.bgs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);text-align:left;border:2px solid transparent}
.opt[aria-pressed="true"],.bgopt[aria-pressed="true"]{border-color:var(--accent)}
.opt .oa{font-size:26px;line-height:1.1}
.opt .on{font-size:14px;color:var(--muted)}
.bgopt{display:flex;flex-direction:column;gap:6px;align-items:center;padding:0 0 8px;border-radius:12px;border:2px solid transparent;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;font-size:13px}
.bgopt .pv{width:100%;height:64px;background:var(--pb);display:flex;align-items:center;justify-content:center}
.bgopt .mini{position:relative;width:56%;height:36px;border-radius:5px;background:var(--pc);box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.bgopt .mini::before{content:"";position:absolute;left:0;right:0;top:9px;height:1.5px;background:#C8433A;opacity:.6}
.bgopt .mini::after{content:"";position:absolute;left:18%;right:18%;top:20px;height:4px;border-radius:2px;background:var(--pi)}
.bgopt .pv.split{background:linear-gradient(135deg,#EDEFEA 50%,#111513 50%)}
.tcolors{display:flex;flex-wrap:wrap;gap:14px}
.tc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);width:52px}
.tc i{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-style:normal;font-family:var(--serif);font-weight:600;font-size:20px;color:var(--c)}
.tc[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.demo{position:relative;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px 20px;text-align:center;overflow:hidden}
.demo::before{content:"";position:absolute;left:0;right:0;top:40px;height:2px;background:var(--red);opacity:.55}
.demo .side{justify-content:center;height:24px}
.demo p{margin:22px 0 0;font-family:var(--serif);font-weight:600;font-size:28px}
.demo small{display:block;color:var(--muted);font-family:var(--serif);font-size:17px;margin-top:4px}
#syncBox{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
#syncBox p{margin:0}
#syncBox .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#syncBox input{font-size:17px}
.syncmsg{font-size:14px;color:var(--muted)}
.syncmsg.err{color:var(--red)}
.syncline{display:inline-flex;align-items:center;gap:6px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.ok{background:#2F855A}.syncdot.busy{background:#C98A1B}.syncdot.err{background:var(--red)}
@media (prefers-reduced-motion: reduce){.flash,.prog>div{transition:none}.flash.in,.sheet{animation:none}}
</style>
</head>
<body>

<header class="bar">
  <div id="hleft"></div>
  <h1 id="htitle">Vokabelkasten</h1>
  <div class="hright" id="hright"></div>
</header>
<main id="view"><p class="loading">Lade deine Fächer …</p></main>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="sheet" autocomplete="off">
    <h2>Neues Fach</h2>
    <label class="field"><span>Name</span><input type="text" id="sheetName" maxlength="40" placeholder="z. B. Englisch, Latein, Bio"></label>
    <div class="swatches" id="sheetSw"></div>
    <div class="row">
      <button type="button" class="btn" data-action="sheet-cancel">Abbrechen</button>
      <button type="submit" class="btn primary">Anlegen</button>
    </div>
  </form>
</div>
<div class="scrim" id="iscrim" hidden>
  <div class="sheet">
    <h2>Importieren</h2>
    <p class="sub" id="isum"></p>
    <input type="file" id="ifile" accept=".json,application/json,text/plain" hidden>
    <button type="button" class="btn wide" data-action="pick-file">Datei auswählen</button>
    <label class="field"><span>Oder Export-Text einfügen</span><textarea id="itext" rows="3" placeholder='{"app":"vokabelkasten", …}'></textarea></label>
    <div class="row">
      <button type="button" class="btn" data-action="import-cancel">Abbrechen</button>
      <button type="button" class="btn primary" id="igo" data-action="import-go" disabled>Importieren</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script>
const COLORS=['#C8433A','#2E6DB4','#2F855A','#C98A1B','#7B4BA8','#2F8A8A'];
const S={folders:{},cards:{},ready:false,view:{name:'home'},learn:null};
const pend={}, timers={}, writeQ={};
let db=null, pendName=null, nameTimer=null, sheetColor=COLORS[0], swiped=false, builtEditFor=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const plural=(n,one,many)=>n+' '+(n===1?one:many);

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}

/* ---------- Speicher ---------- */
const LS='vokabelkasten.v1';
const OB='vokabelkasten.outbox';
let outbox={}, obSeq=0;
try{outbox=JSON.parse(localStorage.getItem(OB)||'{}')||{};}catch(e){}
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.folders=d.folders||{};S.cards=d.cards||{};}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({folders:S.folders,cards:S.cards}));localStorage.setItem(OB,JSON.stringify(outbox));}catch(e){toast('Speichern fehlgeschlagen. Ist der Speicher des iPhones voll?');}}
function onWriteErr(e){
  if(e&&e.code==='quota_exceeded')toast('Speicher voll. Lösche alte Karten, dann klappt es wieder.');
  else toast('Konnte nicht speichern. Prüfe deine Verbindung.');
}
function queue(path,fn){const p=(writeQ[path]||Promise.resolve()).then(fn).catch(onWriteErr);writeQ[path]=p;return p;}
function dirty(col,id,op){outbox[col+'/'+id]={op,v:++obSeq+Date.now()};lsSave();scheduleSync();}
function put(col,id,data){S[col][id]=data;dirty(col,id,'up');}
function patch(col,id,data){if(!S[col][id])return;S[col][id]={...S[col][id],...data};dirty(col,id,'up');}
function del(col,id){delete S[col][id];dirty(col,id,'del');}

function foldersSorted(){return Object.entries(S.folders).map(([id,f])=>({id,...f})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));}
function cardsOf(fid){return Object.entries(S.cards).filter(([,c])=>c.folderId===fid).map(([id,c])=>({id,...c,...(pend[id]||{})})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));}

/* ---------- Navigation ---------- */
function go(view){flushAll();S.view=view;builtEditFor=null;render();window.scrollTo(0,0);}
function back(){
  const v=S.view;
  if(v.name==='edit'||v.name==='learn')go({name:'folder',id:v.id});
  else go({name:'home'});
}
function header(title,left,right){
  $('#htitle').textContent=title;
  $('#hleft').innerHTML=left?`<button class="hbtn" data-action="back">‹ ${esc(left)}</button>`:'';
  $('#hright').innerHTML=right||'';
}

/* ---------- Ansichten ---------- */
function render(){
  const main=$('#view');
  if(!S.ready){header('Vokabelkasten');main.innerHTML='<p class="loading">Lade deine Fächer …</p>';return;}
  const v=S.view;
  if(v.id&&!S.folders[v.id]){S.view={name:'home'};return render();}
  if(v.name==='home')return viewHome(main);
  if(v.name==='folder')return viewFolder(main,v.id);
  if(v.name==='edit')return viewEdit(main,v.id);
  if(v.name==='learn')return viewLearn(main,v.id);
  if(v.name==='settings')return viewSettings(main);
}

function viewHome(main){
  setTimeout(drawSyncLine,0);
  header('Vokabelkasten',null,`<button class="gear" data-action="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>`);

function isDark(){
  const P=BGS[S.design.bg];if(P&&P.t)return P.dark;
  const th=document.documentElement.getAttribute('data-theme');
  return th==='dark'||(th!=='light'&&sysDark.matches);
}
function applyDesign(){
  const r=document.documentElement,d=S.design,P=BGS[d.bg],F=FONTS[d.font],T=TEXTS[d.text];
  ['--bg','--surface','--card','--ink','--muted','--line','--accent','--accent-ink','--accent-soft','--rule','--red','--shadow','--display','--body','--serif'].forEach(k=>r.style.removeProperty(k));
  r.style.removeProperty('color-scheme');
  if(P&&P.t){Object.entries({...P.t,...(P.dark?DX:LX)}).forEach(([k,v])=>r.style.setProperty(k,v));r.style.colorScheme=P.dark?'dark':'light';}
  if(T&&T.light)r.style.setProperty('--ink',isDark()?T.dark:T.light);
  if(F&&F.v)Object.entries(F.v).forEach(([k,v])=>r.style.setProperty(k,v));
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=getComputedStyle(r).getPropertyValue('--bg').trim()||'#EDEFEA';
}

}

/* ---------- Export & Import ---------- */
const APP_ID='vokabelkasten';
async function exportAll(){
  flushAll();
  const data={app:APP_ID,version:1,exportedAt:new Date().toISOString(),
    folders:foldersSorted().map(f=>({id:f.id,name:f.name,color:f.color,createdAt:f.createdAt,
      cards:cardsOf(f.id).map(c=>({id:c.id,front:c.front||'',back:c.back||'',createdAt:c.createdAt}))}))};
  const json=JSON.stringify(data,null,2);
  const filename='vokabelkasten-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([json],filename,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Vokabelkasten-Export'});return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  try{
    const url=URL.createObjectURL(file),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Export gespeichert: '+filename);
  }catch(e){
    try{await navigator.clipboard.writeText(json);toast('Export als Text kopiert. Beim Import einfach einfügen.');}
    catch(e2){toast('Export hat nicht geklappt.');}
  }
}

let importData=null;
const validId=s=>typeof s==='string'&&/^[A-Za-z0-9_\-]{1,60}$/.test(s);
const str=(s,max)=>typeof s==='string'?s.slice(0,max):'';
function parseImport(text){
  let o;try{o=JSON.parse(text);}catch(e){return null;}
  if(!o||o.app!==APP_ID||!Array.isArray(o.folders))return null;
  const folders=o.folders.filter(f=>f&&typeof f.name==='string'&&f.name.trim()).map((f,i)=>({
    id:validId(f.id)?f.id:uid(), name:str(f.name,40).trim(),
    color:COLORS.includes(f.color)?f.color:COLORS[i%COLORS.length],
    createdAt:Number(f.createdAt)||Date.now()+i,
    cards:(Array.isArray(f.cards)?f.cards:[]).filter(c=>c&&typeof c==='object').map((c,j)=>({
      id:validId(c.id)?c.id:uid(), front:str(c.front,2000), back:str(c.back,2000),
      createdAt:Number(c.createdAt)||Date.now()+j}))
  }));
  return folders.length?folders:null;
}
function setImport(folders,sourceLabel){
  importData=folders;
  const sum=$('#isum'), go=$('#igo');
  if(!folders){sum.textContent='Das ist keine gültige Vokabelkasten-Datei.';go.disabled=true;return;}
  const n=folders.reduce((a,f)=>a+f.cards.length,0);
  sum.textContent=`${sourceLabel}: ${plural(folders.length,'Fach','Fächer')} mit ${plural(n,'Karte','Karten')}. Neue Fächer und Karten kommen dazu, bereits vorhandene werden aktualisiert. Es wird nichts gelöscht.`;
  go.disabled=false;
}
function openImport(){
  importData=null;$('#itext').value='';$('#ifile').value='';
  $('#isum').textContent='Wähle eine Export-Datei (.json) aus oder füge den kopierten Export-Text ein.';
  $('#igo').disabled=true;$('#igo').textContent='Importieren';$('#iscrim').hidden=false;
}
async function runImport(){
  const folders=importData;if(!folders)return;
  const btn=$('#igo');btn.disabled=true;
  const total=folders.reduce((a,f)=>a+1+f.cards.length,0);let done=0;
  const write=async(col,id,data)=>{S[col][id]=data;outbox[col+'/'+id]={op:'up',v:++obSeq+Date.now()};done++;btn.textContent=`Importiere ${done}/${total} …`;};
  try{
    for(const f of folders){
      await write('folders',f.id,{name:f.name,color:f.color,createdAt:f.createdAt});
      for(const c of f.cards)await write('cards',c.id,{folderId:f.id,front:c.front,back:c.back,createdAt:c.createdAt});
    }
    lsSave();scheduleSync(300);
    $('#iscrim').hidden=true;go({name:'home'});
    toast(`Importiert: ${plural(folders.length,'Fach','Fächer')}, ${plural(total-folders.length,'Karte','Karten')}`);
  }catch(e){
    if(!db)lsSave();
    btn.textContent='Importieren';btn.disabled=false;onWriteErr(e);render();
  }
}

function viewEdit(main,id){
  const f=S.folders[id];
  header('Bearbeiten',f.name,`<button class="hbtn" data-action="back">Fertig</button>`);
  $('#hleft').innerHTML='';
  if(builtEditFor!==id){
    builtEditFor=id;
    main.innerHTML=`
      <label class="field"><span>Name des Fachs</span><input type="text" id="fname" maxlength="40" value="${esc(f.name)}"></label>
      <div class="swatches" id="esw">${COLORS.map(c=>`<button class="sw" style="--c:${c}" data-action="color" data-c="${c}" aria-label="Farbe ${c}" aria-pressed="false"></button>`).join('')}</div>
      <h3 class="label">Karten</h3>
      <p class="empty" id="eempty">Noch keine Karten. Tippe unten auf „Neue Karte“.</p>
      <div id="elist"></div>
      <div class="addbar"><button class="btn primary wide" data-action="add-card">+ Neue Karte</button></div>
      <button class="danger" data-action="del-folder">Fach löschen</button>`;
  }
  const fn=$('#fname'); if(fn!==document.activeElement&&pendName===null&&fn.value!==f.name)fn.value=f.name;
  document.querySelectorAll('#esw .sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===f.color)));
  const list=$('#elist'), cards=cardsOf(id);
  const existing=new Map([...list.children].map(el=>[el.dataset.id,el]));
  cards.forEach((c,i)=>{
    let el=existing.get(c.id);
    if(el)existing.delete(c.id);
    else{
      el=document.createElement('article');el.className='ecard';el.dataset.id=c.id;
      el.innerHTML=`<div class="etop"><span class="num"></span><button class="del" data-action="del-card">Löschen</button></div>
        <label class="field"><span>Vorderseite</span><textarea id="f-${c.id}" data-field="front" rows="1" placeholder="z. B. the apple"></textarea></label>
        <label class="field"><span>Rückseite</span><textarea id="b-${c.id}" data-field="back" rows="1" placeholder="z. B. der Apfel"></textarea></label>`;
    }
    if(list.children[i]!==el)list.insertBefore(el,list.children[i]||null);
    el.querySelector('.num').textContent='Karte '+(i+1);
    el.querySelectorAll('textarea').forEach(ta=>{
      const val=c[ta.dataset.field]||'';
      if(ta!==document.activeElement&&!pend[c.id]&&ta.value!==val)ta.value=val;
      grow(ta);
    });
  });
  existing.forEach(el=>el.remove());
  $('#eempty').hidden=cards.length>0;
}
function grow(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+2+'px';}
function flush(id){
  clearTimeout(timers[id]);const p=pend[id];if(!p)return;delete pend[id];
  if(S.cards[id])patch('cards',id,p);
}
function flushName(){
  clearTimeout(nameTimer);if(pendName===null)return;
  const n=pendName.trim();pendName=null;const id=S.view.id;
  if(n&&S.folders[id]&&n!==S.folders[id].name){patch('folders',id,{name:n});}
}
function flushAll(){Object.keys(pend).forEach(flush);flushName();}

/* Lernmodus */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startLearn(id,mix){
  let ids=cardsOf(id).filter(c=>(c.front||c.back||'').trim()).map(c=>c.id);
  if(mix)shuffle(ids);
  S.learn={id,ids,i:0,flipped:false,mix,dir:1};
  go({name:'learn',id});
}
function viewLearn(main,id){
  const f=S.folders[id], L=S.learn;
  if(!L||L.id!==id){startLearn(id,false);return;}
  L.ids=L.ids.filter(x=>S.cards[x]);
  header(f.name,f.name,`<button class="hbtn" data-action="mix" aria-pressed="${L.mix}">${L.mix?'Gemischt ✓':'Mischen'}</button>`);
  const n=L.ids.length;
  if(!n){go({name:'folder',id});return;}
  if(L.i>=n){
    main.innerHTML=`<div class="done">
      <h2 class="big">Geschafft!</h2>
      <p class="sub">Du bist alle ${plural(n,'Karte','Karten')} in „${esc(f.name)}“ durchgegangen.</p>
      <button class="btn primary wide" data-action="again">Nochmal von vorn</button>
      <button class="btn wide" data-action="again-mix">Gemischt wiederholen</button>
      <button class="btn ghost wide" data-action="back">Zurück zum Fach</button></div>`;
    return;
  }
  const c=S.cards[L.ids[L.i]];
  const face=(label,txt,hint)=>{const t=(txt||'').trim();const cls=!t?'none':t.length>60?'l':t.length>18?'m':'';
    return `<span class="side">${label}</span><p class="word ${cls}">${t?esc(t):'(leer)'}</p>${hint?`<span class="hint">${hint}</span>`:''}`;};
  main.innerHTML=`<div class="learn">
    <div class="prog" aria-hidden="true"><div style="width:${(L.i+1)/n*100}%"></div></div>
    <p class="count">Karte ${L.i+1} von ${n}</p>
    <div class="stage" id="stage">
      <div class="flash no-anim in ${L.dir<0?'back-in':''} ${L.flipped?'flipped':''}" id="flash" role="button" tabindex="0" data-action="flip" aria-label="Karte umdrehen">
        <div class="face front">${face('Vorderseite',c.front,'Tippen zum Umdrehen')}</div>
        <div class="face back">${face('Rückseite',c.back,'Wischen für die nächste Karte')}</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" data-action="prev" ${L.i===0?'disabled':''}>‹ Zurück</button>
      <button class="btn primary" data-action="flip">Umdrehen</button>
      <button class="btn" data-action="next">Weiter ›</button>
    </div></div>`;
  const fl=$('#flash');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove('no-anim')));
  fl.addEventListener('animationend',()=>fl.classList.remove('in','back-in'),{once:true});
  const st=$('#stage');let x0=null,y0=null;
  st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;swiped=false;},{passive:true});
  st.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){swiped=true;dx<0?step(1):(L.i>0&&step(-1));}},{passive:true});
}
function flip(){const L=S.learn;L.flipped=!L.flipped;$('#flash')?.classList.toggle('flipped',L.flipped);}
function step(d){const L=S.learn;L.i=Math.max(0,L.i+d);L.flipped=false;L.dir=d;render();}

/* ---------- Aktionen ---------- */
function armed(btn,label,armedLabel){
  if(btn.classList.contains('armed'))return true;
  btn.classList.add('armed');btn.textContent=armedLabel;
  setTimeout(()=>{btn.classList.remove('armed');btn.textContent=label;},3000);
  return false;
}
function openSheet(){
  sheetColor=COLORS[Object.keys(S.folders).length%COLORS.length];
  $('#sheetName').value='';drawSheetSw();$('#scrim').hidden=false;setTimeout(()=>$('#sheetName').focus(),50);
}
function drawSheetSw(){$('#sheetSw').innerHTML=COLORS.map(c=>`<button type="button" class="sw" style="--c:${c}" data-action="sheet-color" data-c="${c}" aria-label="Farbe ${c}" aria-pressed="${c===sheetColor}"></button>`).join('');}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action, v=S.view;
  switch(a){
    case 'back':back();break;
    case 'open':go({name:'folder',id:b.dataset.id});break;
    case 'new-folder':openSheet();break;
    case 'sheet-cancel':$('#scrim').hidden=true;break;
    case 'sheet-color':sheetColor=b.dataset.c;drawSheetSw();break;
    case 'edit':go({name:'edit',id:v.id});break;
    case 'learn':startLearn(v.id,false);break;
    case 'color':patch('folders',v.id,{color:b.dataset.c});render();break;
    case 'add-card':{
      flushAll();const id=uid();
      put('cards',id,{folderId:v.id,front:'',back:'',createdAt:Date.now()});render();
      const ta=document.getElementById('f-'+id);ta?.focus();ta?.closest('.ecard').scrollIntoView({block:'center',behavior:'smooth'});break;}
    case 'del-card':{
      if(!armed(b,'Löschen','Wirklich löschen?'))break;
      const id=b.closest('.ecard').dataset.id;clearTimeout(timers[id]);delete pend[id];del('cards',id);render();break;}
    case 'del-folder':{
      if(!armed(b,'Fach löschen','Fach und alle Karten wirklich löschen?'))break;
      const id=v.id;cardsOf(id).forEach(c=>{clearTimeout(timers[c.id]);delete pend[c.id];del('cards',c.id);});
      pendName=null;del('folders',id);go({name:'home'});toast('Fach gelöscht');break;}
    case 'flip':if(swiped){swiped=false;break;}flip();break;
    case 'next':step(1);break;
    case 'prev':step(-1);break;
    case 'mix':startLearn(v.id,!S.learn.mix);break;
    case 'again':startLearn(v.id,false);break;
    case 'again-mix':startLearn(v.id,true);break;
    case 'export':exportAll();break;
    case 'import':openImport();break;
    case 'pick-file':$('#ifile').click();break;
    case 'import-cancel':$('#iscrim').hidden=true;break;
    case 'import-go':runImport();break;
    case 'settings':go({name:'settings'});break;
    case 'sync-login':doAuth(false);break;
    case 'sync-signup':doAuth(true);break;
    case 'sync-now':SY.msg='';syncNow();break;
    case 'sync-logout':SY.msg='';SY.sb.auth.signOut().then(()=>{SY.user=null;SY.last=null;drawSync();toast('Abgemeldet. Deine Karten bleiben auf diesem Gerät.');});break;
    case 'set-design':S.design={...S.design,[b.dataset.key]:b.dataset.val};applyDesign();saveDesign();render();break;
    case 'reset-design':S.design={...DESIGN_DEF};applyDesign();saveDesign();render();toast('Design zurückgesetzt');break;
  }
});
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();const name=$('#sheetName').value.trim();
  if(!name){$('#sheetName').focus();return;}
  const id=uid();put('folders',id,{name,color:sheetColor,createdAt:Date.now()});
  $('#scrim').hidden=true;go({name:'edit',id});
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')$('#scrim').hidden=true;});
$('#iscrim').addEventListener('click',e=>{if(e.target.id==='iscrim'&&!$('#igo').textContent.startsWith('Importiere '))$('#iscrim').hidden=true;});
$('#ifile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{setImport(parseImport(await f.text()),'„'+f.name+'“');}catch(err){setImport(null);}
});
$('#itext').addEventListener('input',e=>{const t=e.target.value.trim();if(!t){importData=null;$('#igo').disabled=true;return;}setImport(parseImport(t),'Eingefügter Text');});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.field){
    const id=t.closest('.ecard').dataset.id,c=S.cards[id]||{};
    pend[id]={front:c.front||'',back:c.back||'',...(pend[id]||{}),[t.dataset.field]:t.value};
    grow(t);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700);
  }else if(t.id==='fname'){pendName=t.value;clearTimeout(nameTimer);nameTimer=setTimeout(flushName,700);}
});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.field)flush(t.closest('.ecard').dataset.id);
  else if(t.id==='fname')flushName();
});
document.addEventListener('keydown',e=>{
  if(S.view.name!=='learn'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft'&&S.learn.i>0)step(-1);
});
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushAll();syncNow();}else scheduleSync(300);});
window.addEventListener('online',()=>scheduleSync(500));
setInterval(()=>{if(!document.hidden)syncNow();},20000);

/* ---------- Synchronisierung (Supabase) ---------- */
const CFG=window.VOKABEL_SYNC||{};
const SYNCED_USER='vokabelkasten.syncedUser';
const SY={sb:null,user:null,busy:false,again:false,timer:null,last:null,err:null,msg:'',msgErr:false};
const configured=()=>!!(CFG.url&&CFG.anonKey);
function scheduleSync(ms=1500){clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,ms);}
function loadSupabase(){
  if(!configured())return;
  const sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  sc.onload=startSync;sc.onerror=()=>{SY.err='Abgleich gerade nicht erreichbar (offline?).';drawSync();};
  document.head.appendChild(sc);
}
async function startSync(){
  if(!window.supabase)return;
  SY.sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'vokabelkasten.auth'}});
  try{const {data}=await SY.sb.auth.getSession();SY.user=data.session?data.session.user:null;}catch(e){}
  SY.sb.auth.onAuthStateChange((ev,session)=>{
    const was=SY.user&&SY.user.id;SY.user=session?session.user:null;
    if(SY.user&&SY.user.id!==was)onLogin();
    drawSync();
  });
  if(SY.user)onLogin();
  drawSync();
}
function onLogin(){
  let prev=null;try{prev=localStorage.getItem(SYNCED_USER);}catch(e){}
  if(prev!==SY.user.id){ // erstes Mal auf diesem Gerät: alles Lokale ins Konto übernehmen
    Object.keys(S.folders).forEach(id=>outbox['folders/'+id]={op:'up',v:++obSeq+Date.now()});
    Object.keys(S.cards).forEach(id=>outbox['cards/'+id]={op:'up',v:++obSeq+Date.now()});
    try{localStorage.setItem(SYNCED_USER,SY.user.id);}catch(e){}
    lsSave();
  }
  syncNow();
}
const chk=r=>{if(r&&r.error)throw r.error;return r;};
const chunks=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
async function fetchAll(table){
  let all=[];for(let from=0;;from+=1000){
    const r=chk(await SY.sb.from(table).select('*').order('id').range(from,from+999));
    all=all.concat(r.data||[]);if(!r.data||r.data.length<1000)break;
  }return all;
}
async function syncNow(){
  if(!SY.sb||!SY.user)return;
  if(!navigator.onLine){drawSync();return;}
  if(SY.busy){SY.again=true;return;}
  SY.busy=true;drawSync();
  try{
    flushAll();
    const uidv=SY.user.id, now=new Date().toISOString();
    const ops=Object.entries(outbox).map(([k,o])=>[k,o.op,o.v]);
    const up={folders:[],cards:[]},rm={folders:[],cards:[]};let design=false;
    for(const [k,op] of ops){
      const [col,id]=k.split('/');
      if(col==='settings'){design=true;continue;}
      if(!up[col])continue;
      const d=S[col][id];
      if(op==='del'||!d){rm[col].push(id);continue;}
      up[col].push(col==='folders'
        ?{user_id:uidv,id,name:d.name||'',color:d.color||null,created_at:Math.round(d.createdAt||0),updated_at:now}
        :{user_id:uidv,id,folder_id:d.folderId,front:d.front||'',back:d.back||'',created_at:Math.round(d.createdAt||0),updated_at:now});
    }
    for(const c of chunks(up.folders,500))chk(await SY.sb.from('folders').upsert(c,{onConflict:'user_id,id'}));
    for(const c of chunks(up.cards,500))chk(await SY.sb.from('cards').upsert(c,{onConflict:'user_id,id'}));
    for(const c of chunks(rm.cards,100))chk(await SY.sb.from('cards').delete().in('id',c));
    for(const c of chunks(rm.folders,100))chk(await SY.sb.from('folders').delete().in('id',c));
    if(design)chk(await SY.sb.from('settings').upsert({user_id:uidv,design:S.design,updated_at:now},{onConflict:'user_id'}));
    ops.forEach(([k,,v])=>{if(outbox[k]&&outbox[k].v===v)delete outbox[k];});

    const [fr,cr,sr]=await Promise.all([fetchAll('folders'),fetchAll('cards'),SY.sb.from('settings').select('design').maybeSingle()]);
    chk(sr);
    const nf={},nc={};
    fr.forEach(r=>nf[r.id]={name:r.name,color:r.color||COLORS[0],createdAt:Number(r.created_at)||0});
    cr.forEach(r=>nc[r.id]={folderId:r.folder_id,front:r.front||'',back:r.back||'',createdAt:Number(r.created_at)||0});
    for(const [k,o] of Object.entries(outbox)){ // Änderungen, die während des Abgleichs passiert sind
      const [col,id]=k.split('/');const t=col==='folders'?nf:col==='cards'?nc:null;if(!t)continue;
      if(o.op==='del')delete t[id];else if(S[col][id])t[id]=S[col][id];
    }
    const changed=JSON.stringify([S.folders,S.cards])!==JSON.stringify([nf,nc]);
    S.folders=nf;S.cards=nc;lsSave();
    if(sr.data&&sr.data.design&&!outbox['settings/design']){
      const nd={...DESIGN_DEF,...sr.data.design};
      if(JSON.stringify(nd)!==JSON.stringify(S.design)){S.design=nd;try{localStorage.setItem(DLS,JSON.stringify(nd));}catch(e){}applyDesign();if(S.view.name==='settings')render();}
    }
    if(changed&&S.view.name!=='settings')render();
    SY.last=Date.now();SY.err=null;
  }catch(e){
    SY.err=(e&&e.message)||String(e);
  }finally{
    SY.busy=false;drawSync();
    if(SY.again){SY.again=false;scheduleSync(300);}
  }
}
function syncState(){
  if(!configured())return {cls:'',text:''};
  if(!SY.user)return {cls:'',text:'Nicht angemeldet: nur auf diesem Gerät'};
  if(SY.busy)return {cls:'busy',text:'Gleiche ab …'};
  if(!navigator.onLine)return {cls:'busy',text:'Offline: wird später abgeglichen'};
  if(SY.err)return {cls:'err',text:'Abgleich fehlgeschlagen'};
  if(Object.keys(outbox).length)return {cls:'busy',text:'Änderungen warten auf Abgleich'};
  if(SY.last)return {cls:'ok',text:'Abgeglichen um '+new Date(SY.last).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})};
  return {cls:'busy',text:'Verbinde …'};
}
function drawSyncLine(){
  const el=$('#syncLine');if(!el)return;
  const st=syncState();
  el.innerHTML=st.text?`<span class="syncdot ${st.cls}"></span>${esc(st.text)}`:'';
}
function drawSync(){drawSyncLine();drawSyncBox(false);}
function drawSyncBox(force){
  const box=$('#syncBox');if(!box)return;
  if(!force&&box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;
  const msg=SY.msg?`<p class="syncmsg ${SY.msgErr?'err':''}">${esc(SY.msg)}</p>`:'';
  if(!configured()){
    box.innerHTML=`<p>Der Abgleich ist noch nicht eingerichtet.</p><p class="syncmsg">Trag in der Datei <b>config.js</b> die Daten deines Supabase-Projekts ein. Wie das geht, steht in der Anleitung.</p>`;return;
  }
  if(!SY.sb){box.innerHTML=`<p class="syncmsg ${SY.err?'err':''}">${esc(SY.err||'Verbinde mit Supabase …')}</p>`;return;}
  if(!SY.user){
    box.innerHTML=`<p>Melde dich auf jedem Gerät mit demselben Konto an. Dann sind deine Karten überall gleich.</p>
      <label class="field"><span>E-Mail</span><input type="email" id="sEmail" autocomplete="username" autocapitalize="off" inputmode="email"></label>
      <label class="field"><span>Passwort</span><input type="password" id="sPass" autocomplete="current-password" minlength="6"></label>
      ${msg}
      <div class="row2"><button class="btn" data-action="sync-signup">Konto erstellen</button><button class="btn primary" data-action="sync-login">Anmelden</button></div>`;
    return;
  }
  const st=syncState();
  box.innerHTML=`<p>Angemeldet als <b>${esc(SY.user.email||'')}</b></p>
    <p class="syncmsg ${st.cls==='err'?'err':''}"><span class="syncline"><span class="syncdot ${st.cls}"></span>${esc(st.text)}</span></p>
    ${SY.err?`<p class="syncmsg err">${esc(SY.err)}</p>`:''}${msg}
    <div class="row2"><button class="btn" data-action="sync-logout">Abmelden</button><button class="btn primary" data-action="sync-now">Jetzt abgleichen</button></div>`;
}
function authMsg(m){
  const t={'Invalid login credentials':'E-Mail oder Passwort ist falsch.','Email not confirmed':'Bitte bestätige zuerst deine E-Mail über den Link in deinem Postfach.',
    'User already registered':'Für diese E-Mail gibt es schon ein Konto. Tippe auf „Anmelden“.','Signups not allowed for this instance':'Neue Konten sind in deinem Supabase-Projekt gesperrt.'};
  return t[m]||m;
}
async function doAuth(signup){
  const email=($('#sEmail')||{}).value?.trim(),pw=($('#sPass')||{}).value||'';
  if(!email||pw.length<6){SY.msg='Gib deine E-Mail und ein Passwort mit mindestens 6 Zeichen ein.';SY.msgErr=true;drawSyncBox(true);return;}
  SY.msg=signup?'Erstelle Konto …':'Melde an …';SY.msgErr=false;drawSyncBox(true);
  try{
    const r=signup?await SY.sb.auth.signUp({email,password:pw}):await SY.sb.auth.signInWithPassword({email,password:pw});
    if(r.error){SY.msg=authMsg(r.error.message);SY.msgErr=true;}
    else if(signup&&!r.data.session){SY.msg='Fast geschafft: Öffne die E-Mail von Supabase und tippe auf den Bestätigungslink. Danach hier auf „Anmelden“ tippen.';SY.msgErr=false;}
    else{SY.msg='';}
  }catch(e){SY.msg='Keine Verbindung. Bist du online?';SY.msgErr=true;}
  drawSyncBox(true);
}

/* ---------- Start ---------- */
const SEEDED='vokabelkasten.seeded';
function seedExample(){
  try{if(localStorage.getItem(SEEDED)||Object.keys(S.folders).length)return;localStorage.setItem(SEEDED,'1');}catch(e){return;}
  const t=Date.now();S.folders['beispiel-en']={name:'Englisch (Beispiel)',color:'#2E6DB4',createdAt:t};
  [['the apple','der Apfel'],['to remember','sich erinnern'],['the knowledge','das Wissen'],['reliable','zuverlässig']]
    .forEach(([f,b],i)=>S.cards['bsp'+(i+1)]={folderId:'beispiel-en',front:f,back:b,createdAt:t+i+1});
  lsSave();
}
function init(){
  lsLoad();seedExample();S.ready=true;render();
  loadSupabase();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();init();
</script>
